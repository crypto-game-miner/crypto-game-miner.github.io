<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Miner — Settings</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #1a1613; -webkit-user-select: none; color: white; font-family: 'Courier New', Courier, monospace; }
        #main-content { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        .header { padding: 15px 20px; font-weight: bold; color: #facc15; font-size: 18px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .back-btn { color: #facc15; text-decoration: none; font-size: 20px; }
        .settings-area { flex: 1; padding: 15px 20px; overflow-y: auto; }
        .settings-section { margin-bottom: 20px; }
        .section-title { color: #8b949e; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .settings-card { background: #261e19; border: 1px solid #3d2b1f; border-radius: 12px; overflow: hidden; }
        .settings-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 15px; border-bottom: 1px solid #3d2b1f; }
        .settings-item:last-child { border-bottom: none; }
        .settings-label { font-size: 14px; color: white; }
        .settings-value { font-size: 12px; color: #8b949e; }
        .settings-btn { background: #facc15; color: #1a1613; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .google-btn { background: white; color: #333; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>
    <div id="main-content">
        <div class="header">
            <a href="home.html" class="back-btn">← Home</a>
            <span>Settings</span>
            <span style="width:60px;"></span>
        </div>

        <div class="settings-area">

            <div class="settings-section">
                <div class="section-title">Account</div>
                <div class="settings-card">
                    <div class="settings-item">
                        <div>
                            <div class="settings-label">Google Account</div>
                            <div class="settings-value" id="account-desc">Sign in to get +0.3 GH/s bonus!</div>
                        </div>
                        <button class="google-btn" id="google-btn">
                            <span style="font-weight:bold;color:#4285F4;">G</span> Sign in
                        </button>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <div class="section-title">My Stats</div>
                <div class="settings-card">
                    <div class="settings-item">
                        <span class="settings-label">Total Coins</span>
                        <span class="settings-value" id="stat-coins">0</span>
                    </div>
                    <div class="settings-item">
                        <span class="settings-label">LTC Coins Mined</span>
                        <span class="settings-value" id="stat-ltc">0</span>
                    </div>
                    <div class="settings-item">
                        <span class="settings-label">Current Level</span>
                        <span class="settings-value" id="stat-level">1</span>
                    </div>
                    <div class="settings-item">
                        <span class="settings-label">Hashrate</span>
                        <span class="settings-value" id="stat-hashrate">0 GH/s</span>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <div class="section-title">Withdrawal Limits</div>
                <div class="settings-card">
                    <div class="settings-item">
                        <span class="settings-label">Daily USDT Withdraw Limit</span>
                        <span class="settings-value">1000 Coins/day</span>
                    </div>
                    <div class="settings-item">
                        <span class="settings-label">Withdrawn Today</span>
                        <span class="settings-value" id="withdrawn-today">0 / 1000</span>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <div class="section-title">Danger Zone</div>
                <div class="settings-card">
                    <div class="settings-item">
                        <div>
                            <div class="settings-label">Reset Progress</div>
                            <div class="settings-value">Delete all your data</div>
                        </div>
                        <button class="settings-btn" style="background:#ef4444;color:white;" onclick="resetProgress()">Reset</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWMTTJo-iBtS7xxM3mjLWaTC0EOfl6MHw",
            authDomain: "crypto-miner-game-f45dc.firebaseapp.com",
            projectId: "crypto-miner-game-f45dc",
            storageBucket: "crypto-miner-game-f45dc.firebasestorage.app",
            messagingSenderId: "33690622473",
            appId: "1:33690622473:web:f80f6b836c15034e07f6d8",
            measurementId: "G-CT63GXYYJ2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const EXP_PER_LEVEL = [50, 120, 250, 500, 1000];

        function getLevel(exp) {
            let level = 1, totalExp = 0;
            for (let i = 0; i < EXP_PER_LEVEL.length; i++) {
                if (exp >= totalExp + EXP_PER_LEVEL[i]) { totalExp += EXP_PER_LEVEL[i]; level++; }
                else return { level };
            }
            return { level };
        }

        function getWithdrawnToday() {
            const today = new Date().toDateString();
            const lastDay = localStorage.getItem('withdrawDay');
            if (lastDay !== today) {
                localStorage.setItem('withdrawDay', today);
                localStorage.setItem('withdrawnToday', '0');
                return 0;
            }
            return Number(localStorage.getItem('withdrawnToday')) || 0;
        }

        function updateStats() {
            const coins = Number(localStorage.getItem('miner_balance')) || 0;
            const ltc = parseFloat(localStorage.getItem('ltc_balance')) || 0;
            const exp = Number(localStorage.getItem('player_exp')) || 0;
            const hashrate = parseFloat(localStorage.getItem('hashrate')) || 0;
            const { level } = getLevel(exp);
            document.getElementById('stat-coins').innerText = coins;
            document.getElementById('stat-ltc').innerText = ltc.toFixed(6);
            document.getElementById('stat-level').innerText = level;
            document.getElementById('stat-hashrate').innerText = hashrate + ' GH/s';
            const withdrawn = getWithdrawnToday();
            document.getElementById('withdrawn-today').innerText = withdrawn + ' / 1000';
        }

        updateStats();

        const lockedEmail = localStorage.getItem('locked_google_email');
        const bonusGiven = localStorage.getItem('task_register_bonus') === 'done';
        const btn = document.getElementById('google-btn');
        const desc = document.getElementById('account-desc');

        if (lockedEmail) {
            btn.style.display = 'none';
            desc.innerHTML = `<span style="color:#22c55e;">✅ ${lockedEmail}</span><br><span style="font-size:10px;">Account linked permanently</span>`;
        } else {
            btn.onclick = async () => {
                try {
                    const result = await signInWithPopup(auth, new GoogleAuthProvider());
                    const user = result.user;

                    // Даём бонус ПЕРЕД сохранением в Firebase
                    if (!bonusGiven) {
                        let taskBonus = parseFloat(localStorage.getItem('task_bonus_hashrate')) || 0;
                        taskBonus = Math.round((taskBonus + 0.3) * 10) / 10;
                        localStorage.setItem('task_bonus_hashrate', taskBonus);
                        localStorage.setItem('task_register_bonus', 'done');
                    }

                    // Фиксируем email навсегда
                    localStorage.setItem('locked_google_email', user.email);

                    // Сохраняем в Firestore ПОСЛЕ бонуса
                    await saveToFirestore(user.uid, user.email);

                    if (!bonusGiven) {
                        updateStats();
                        alert('🎉 Registration bonus! +0.3 GH/s added to your mining power!');
                    }

                    btn.style.display = 'none';
                    desc.innerHTML = `<span style="color:#22c55e;">✅ ${user.email}</span><br><span style="font-size:10px;">Account linked permanently</span>`;

                } catch(e) {
                    alert('Error: ' + e.message);
                }
            };
        }

        async function saveToFirestore(uid, email) {
            // Берём актуальный hashrate ПОСЛЕ всех бонусов
            const coins = Number(localStorage.getItem('miner_balance')) || 0;
            const ltc = parseFloat(localStorage.getItem('ltc_balance')) || 0;
            const exp = Number(localStorage.getItem('player_exp')) || 0;

            // Пересчитываем hashrate с учётом уровня и бонусов
            const { level } = getLevel(exp);
            const baseHashrate = level >= 2 ? 0.5 : 0;
            const taskBonus = parseFloat(localStorage.getItem('task_bonus_hashrate')) || 0;
            const hashrate = Math.round((baseHashrate + taskBonus) * 10) / 10;
            localStorage.setItem('hashrate', hashrate);

            const userRef = doc(db, 'users', uid);
            const userSnap = await getDoc(userRef);
            const isNewPlayer = !userSnap.exists();

            await setDoc(userRef, {
                coins, ltc, exp, hashrate, email,
                updatedAt: new Date()
            });

            const globalRef = doc(db, 'stats', 'global');
            const globalSnap = await getDoc(globalRef);
            const globalData = globalSnap.exists() ? globalSnap.data() : { totalHashrate: 0, totalPlayers: 0 };

            if (isNewPlayer) {
                await setDoc(globalRef, {
                    totalHashrate: Math.round(((globalData.totalHashrate || 0) + hashrate) * 10) / 10,
                    totalPlayers: (globalData.totalPlayers || 0) + 1,
                    updatedAt: new Date()
                }, { merge: true });
            } else {
                const oldHashrate = userSnap.data().hashrate || 0;
                const diff = Math.round((hashrate - oldHashrate) * 10) / 10;
                if (diff !== 0) {
                    await setDoc(globalRef, {
                        totalHashrate: Math.round(((globalData.totalHashrate || 0) + diff) * 10) / 10,
                        updatedAt: new Date()
                    }, { merge: true });
                }
            }
        }

        window.resetProgress = function() {
            if (confirm('Are you sure? All your progress will be deleted!')) {
                localStorage.clear();
                alert('Progress reset!');
                window.location.href = 'home.html';
            }
        }

        onAuthStateChanged(auth, () => {});
    </script>
</body>
</html>
