<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Miner — Wallet</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #1a1613; -webkit-user-select: none; color: white; font-family: 'Courier New', Courier, monospace; }
        #main-content { display: flex; flex-direction: column; height: 100vh; height: 100dvh; text-align: center; }
        .header { padding: 15px 20px; font-weight: bold; color: #facc15; font-size: 18px; text-align: left; flex-shrink: 0; }
        .balance-container { background: rgba(0,0,0,0.4); margin: 5px 20px; padding: 12px; border-radius: 10px; border: 2px solid #3d2b1f; flex-shrink: 0; }
        .balance-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
        .balance-row:not(:last-child) { border-bottom: 1px solid #3d2b1f; margin-bottom: 6px; padding-bottom: 6px; }
        .wallet-area { padding: 15px; text-align: left; overflow-y: auto; padding-bottom: 350px; flex: 1; }
        .wallet-card { background: #261e19; border: 1px solid #3d2b1f; border-radius: 12px; padding: 10px; margin-bottom: 8px; display: flex; align-items: center; cursor: pointer; }
        .card-info h3 { margin: 0; font-size: 15px; }
        .card-info p { margin: 2px 0; font-size: 10px; color: #facc15; }
        .withdraw-box { background: #261e19; border: 1px solid #facc15; border-radius: 12px; padding: 12px; margin-top: 5px; display: none; }
        .withdraw-box label { display: block; color: #facc15; font-size: 11px; margin-bottom: 4px; }
        .withdraw-box input { width: 100%; background: #1a1613; border: 1px solid #3d2b1f; padding: 8px; color: white; border-radius: 5px; margin-bottom: 10px; box-sizing: border-box; font-family: monospace; outline: none; font-size: 13px; }
        .collect-btn { background: #facc15; color: #1a1613; border: none; padding: 15px 40px; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 4px 0 #a16207; }
        .banner-area { position: fixed; bottom: 70px; left: 0; width: 100%; height: 100px; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; z-index: 999; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #8b949e; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; width: 25%; cursor: pointer; }
        .nav-item.active { color: #facc15; }
        .nav-icon { font-size: 24px; margin-bottom: 3px; }
        body { text-transform: uppercase; }
input { text-transform: none !important; }
        .keyboard-open .banner-area, .keyboard-open .nav-bar { display: none !important; }
    </style>
</head>
<body>
    <div id="main-content">
        <div class="header">Wallet</div>
        <div class="balance-container">
            <div class="balance-row">
                <span style="color:#22c55e;">Game Coins</span>
                <span style="font-weight:bold; color:#22c55e;" id="game-coins">0</span>
            </div>
            <div class="balance-row">
                <span style="color:#facc15;">USDT Coins</span>
                <span style="font-weight:bold;" id="balance">0</span>
            </div>
            <div class="balance-row">
                <span style="color:#a78bfa;">LTC Coins</span>
                <span style="font-weight:bold; color:#a78bfa;" id="ltc-balance">0</span>
            </div>
        </div>

        <div class="wallet-area">
            <h3 style="color:#facc15; margin-bottom:12px; font-size: 16px;">Select Payment Platform</h3>

            <div class="wallet-card" onclick="toggleBox('usdt-box', 'ltc-box')">
                <img src="https://cryptologos.cc/logos/tether-usdt-logo.svg" style="width:35px;height:35px;margin-right:12px;">
                <div class="card-info">
                    <h3>USDT</h3>
                    <p>via FaucetPay</p>
                    <span style="font-size:10px; color:#8b949e">Min: 500 USDT Coins</span>
                </div>
            </div>
            <div id="usdt-box" class="withdraw-box">
                <label>USDT Coins To Convert</label>
                <input type="number" id="wd-points-usdt" placeholder="Min 500">
                <label>FaucetPay Email</label>
                <input type="email" id="wd-email-usdt" placeholder="example@mail.com">
                <button class="collect-btn" style="width:100%;box-shadow:none;padding:10px;font-size:16px;margin-top:10px;" onclick="handleWithdraw('usdt')">Withdraw USDT</button>
            </div>

            <div class="wallet-card" style="margin-top:8px;" onclick="toggleBox('ltc-box', 'usdt-box')">
                <img src="https://cryptologos.cc/logos/litecoin-ltc-logo.svg" style="width:35px;height:35px;margin-right:12px;">
                <div class="card-info">
                    <h3>Litecoin (LTC)</h3>
                    <p>via FaucetPay</p>
                    <span style="font-size:10px; color:#8b949e">Min: 1000 LTC Coins</span>
                </div>
            </div>
            <div id="ltc-box" class="withdraw-box">
                <label>LTC Coins To Withdraw</label>
                <input type="number" id="wd-points-ltc" placeholder="Min 1000">
                <label>FaucetPay Email</label>
                <input type="email" id="wd-email-ltc" placeholder="example@mail.com">
                <button class="collect-btn" style="width:100%;box-shadow:none;padding:10px;font-size:16px;" onclick="handleWithdraw('ltc')">Withdraw LTC</button>
            </div>
        </div>

                        <div class="banner-area">
            <div style="width:320px; margin:0 auto; text-align:center;">
                <iframe src="//ads.coinserom.com/pub?adsunit=353639&size=320x50" style="width:320px;height:50px;border:0px;padding:0;background-color: transparent;overflow: auto;"></iframe>
            </div>
        </div>

        <div class="nav-bar">
            <a href="home.html" class="nav-item">
                <span class="nav-icon">🏠</span>Home
            </a>
            <a href="index.html" class="nav-item">
                <span class="nav-icon">🚰</span>Faucet
            </a>
            <a href="tasks.html" class="nav-item">
                <span class="nav-icon">📋</span>Tasks
            </a>
            <div class="nav-item active">
                <span class="nav-icon">👛</span>Wallet
            </div>
        </div>
    </div>

    <script>
        (function() {
            const lastVisit = Number(localStorage.getItem('lastVisitTime')) || 0;
            const now = Date.now();
            const hashrate = parseFloat(localStorage.getItem('hashrate')) || 0;
            const lastClaim = Number(localStorage.getItem('lastClaimTime')) || 0;
            const hoursSinceClaim = (now - lastClaim) / 1000 / 3600;
            const miningPaused = lastClaim === 0 || hoursSinceClaim > 24;
            if (hashrate > 0 && !miningPaused && lastVisit > 0) {
                const secondsAway = Math.min((now - lastVisit) / 1000, 86400);
                const earned = hashrate * 2 / 3600 * secondsAway;
                if (earned > 0) {
                    let ltc = parseFloat(localStorage.getItem('ltc_balance')) || 0;
                    ltc += earned;
                    localStorage.setItem('ltc_balance', ltc.toFixed(6));
                }
            }
            localStorage.setItem('lastVisitTime', now);
        })();

        const DAILY_LIMIT = 1000;

        function getWithdrawnToday() {
            const today = new Date().toDateString();
            const lastDay = localStorage.getItem('withdrawDay');
            if (lastDay !== today) {
                localStorage.setItem('withdrawDay', today);
                localStorage.setItem('withdrawnToday', '0');
                return 0;
            }
            return Number(localStorage.getItem('withdrawnToday')) || 0;
        }

        let coins = Number(localStorage.getItem('miner_balance')) || 0;
        let gameCoins = Number(localStorage.getItem('game_coins')) || 0;
        let ltcCoins = parseFloat(localStorage.getItem('ltc_balance')) || 0;
        document.getElementById('balance').innerText = coins;
        document.getElementById('game-coins').innerText = gameCoins;
        document.getElementById('ltc-balance').innerText = ltcCoins.toFixed(6);

        function toggleBox(showId, hideId) {
            const show = document.getElementById(showId);
            const hide = document.getElementById(hideId);
            hide.style.display = 'none';
            show.style.display = show.style.display === 'block' ? 'none' : 'block';
        }

        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => document.body.classList.add('keyboard-open'));
            input.addEventListener('blur', () => document.body.classList.remove('keyboard-open'));
        });

        async function handleWithdraw(type) {
            const pointsEl = document.getElementById('wd-points-' + type);
            const emailEl  = document.getElementById('wd-email-' + type);
            const btn      = event.target;
            const points   = Number(pointsEl.value);
            const email    = emailEl.value.trim();
            const minCoins = type === 'usdt' ? 500 : 1000;
            const balance  = type === 'usdt' ? coins : ltcCoins;

            if (!points || points < minCoins) return alert("Minimum " + minCoins + (type === 'usdt' ? " USDT Coins!" : " LTC Coins!"));
            if (points > balance) return alert("Not enough " + (type === 'usdt' ? "USDT Coins!" : "LTC Coins!"));
            if (!email.includes('@')) return alert("Invalid email!");

            if (type === 'usdt') {
                const withdrawnToday = getWithdrawnToday();
                const remaining = DAILY_LIMIT - withdrawnToday;
                if (points > remaining) {
                    return alert(`Daily limit is 1000 USDT Coins/day! You can withdraw ${remaining} more today.`);
                }
            }

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const response = await fetch('https://crypto-game-miner.vercel.app/api/withdraw', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, points, currency: type })
                });
                let result;
                try { result = await response.json(); }
                catch { alert("Server returned unexpected response. HTTP " + response.status); return; }

                if (result.status === 200) {
                    if (type === 'usdt') {
                        coins -= points;
                        localStorage.setItem('miner_balance', coins);
                        document.getElementById('balance').innerText = coins;
                        const newWithdrawn = getWithdrawnToday() + points;
                        localStorage.setItem('withdrawnToday', String(newWithdrawn));
                    } else {
                        ltcCoins -= points;
                        localStorage.setItem('ltc_balance', ltcCoins.toFixed(6));
                        document.getElementById('ltc-balance').innerText = ltcCoins.toFixed(6);
                    }
                    alert("✅ Success! Funds sent to your FaucetPay!");
                } else {
                    alert("❌ FaucetPay error: " + (result.message || JSON.stringify(result)));
                }
            } catch (e) {
                alert("❌ Network error: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = type === 'usdt' ? "Withdraw USDT" : "Withdraw LTC";
            }
        }
    </script>
</body>
</html>
