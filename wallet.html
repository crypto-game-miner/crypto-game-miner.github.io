<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Miner — Wallet</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #1a1613; -webkit-user-select: none; color: white; font-family: 'Courier New', Courier, monospace; }
        #main-content { display: flex; flex-direction: column; height: 100vh; height: 100dvh; text-align: center; }
        .header { padding: 15px 20px; font-weight: bold; color: #facc15; font-size: 18px; text-align: left; flex-shrink: 0; }
        .balance-container { background: rgba(0,0,0,0.4); margin: 5px 20px; padding: 12px; border-radius: 10px; border: 2px solid #3d2b1f; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .amount { color: #ffffff; font-size: 20px; font-weight: bold; }
        .wallet-area { padding: 15px; text-align: left; overflow-y: auto; padding-bottom: 200px; flex: 1; }
        .wallet-card { background: #261e19; border: 1px solid #3d2b1f; border-radius: 12px; padding: 10px; margin-bottom: 8px; display: flex; align-items: center; cursor: pointer; }
        .card-info h3 { margin: 0; font-size: 15px; }
        .card-info p { margin: 2px 0; font-size: 10px; color: #facc15; }
        .withdraw-box { background: #261e19; border: 1px solid #facc15; border-radius: 12px; padding: 12px; margin-top: 5px; }
        .withdraw-box label { display: block; color: #facc15; font-size: 11px; margin-bottom: 4px; }
        .withdraw-box input { width: 100%; background: #1a1613; border: 1px solid #3d2b1f; padding: 8px; color: white; border-radius: 5px; margin-bottom: 10px; box-sizing: border-box; font-family: monospace; outline: none; font-size: 13px; }
        .collect-btn { background: #facc15; color: #1a1613; border: none; padding: 15px 40px; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 4px 0 #a16207; }
        .banner-area { position: fixed; bottom: 80px; left: 0; width: 100%; height: 100px; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; z-index: 999; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #8b949e; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; width: 50%; cursor: pointer; }
        .nav-item.active { color: #facc15; }
        .nav-icon { font-size: 24px; margin-bottom: 3px; }
        .keyboard-open .banner-area, .keyboard-open .nav-bar { display: none !important; }
    </style>
</head>
<body>
    <div id="main-content">
        <div class="header">Crypto Miner</div>
        <div class="balance-container">
            <span style="color: #facc15;">Balance</span>
            <span class="amount" id="balance">0 Coins</span>
        </div>

        <div class="wallet-area">
            <h3 style="color:#facc15; margin-bottom:12px; font-size: 16px;">Select Payment Platform</h3>
            <div class="wallet-card" onclick="document.getElementById('wd-box').style.display='block'">
                <img src="https://cryptologos.cc/logos/tether-usdt-logo.svg" style="width:35px;height:35px;margin-right:12px;">
                <div class="card-info">
                    <h3>USDT</h3>
                    <p>via FaucetPay</p>
                    <span style="font-size:10px; color:#8b949e">Min: 500</span>
                </div>
            </div>

            <div id="wd-box" class="withdraw-box" style="display:none;">
                <label>Points to Convert</label>
                <input type="number" id="wd-points" placeholder="Min 500">
                <label>FaucetPay Email</label>
                <input type="email" id="wd-email" placeholder="example@mail.com">
                <button id="wd-button" class="collect-btn" style="width:100%;box-shadow:none;padding:10px;font-size:16px;" onclick="handleWithdraw()">Withdraw USDT</button>
            </div>
        </div>

        <!-- БАННЕР #2437151 — только на Wallet -->
        <div class="banner-area">
            <iframe data-aa='2437151' src='https://acceptable.a-ads.com/2437151/?size=Adaptive' style='border:0;padding:0;width:100%;height:100px;overflow:hidden;background-color:transparent;'></iframe>
        </div>

        <div class="nav-bar">
            <a href="index.html" class="nav-item">
                <span class="nav-icon">🏠</span>Home
            </a>
            <div class="nav-item active">
                <span class="nav-icon">👛</span>Wallet
            </div>
        </div>
    </div>

    <script>
        let coins = Number(localStorage.getItem('miner_balance')) || 0;
        const balanceDisplay = document.getElementById('balance');
        balanceDisplay.innerText = coins + " Coins";

        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => document.body.classList.add('keyboard-open'));
            input.addEventListener('blur', () => document.body.classList.remove('keyboard-open'));
        });

        async function handleWithdraw() {
            const points = Number(document.getElementById('wd-points').value);
            const email  = document.getElementById('wd-email').value.trim();
            const btn    = document.getElementById('wd-button');

            if (!points || points < 500)   return alert("Minimum 500 coins!");
            if (points > coins)            return alert("Not enough coins!");
            if (!email.includes('@'))      return alert("Invalid email!");

            btn.disabled = true;
            btn.innerText = "Processing...";

            try {
                const response = await fetch('https://crypto-game-miner-github-io.vercel.app/api/withdraw', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, points: points })
                });
                let result;
                try { result = await response.json(); }
                catch { alert("Server returned unexpected response. HTTP " + response.status); return; }

                if (result.status === 200) {
                    coins -= points;
                    localStorage.setItem('miner_balance', coins);
                    balanceDisplay.innerText = coins + " Coins";
                    alert("✅ Success! Funds sent to your FaucetPay!");
                } else {
                    alert("❌ FaucetPay error: " + (result.message || JSON.stringify(result)));
                }
            } catch (e) {
                alert("❌ Network error: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Withdraw USDT";
            }
        }
    </script>
</body>
</html>
