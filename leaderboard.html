<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leaderboard — Hashrate</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #1a1613; color: white; font-family: 'Courier New', Courier, monospace; }
        body { text-transform: uppercase; }
        .header { padding: 15px 20px; font-weight: bold; color: #facc15; font-size: 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #3d2b1f; }
        .refresh-btn { background: none; border: 1px solid #facc15; color: #facc15; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: monospace; text-transform: uppercase; }
        .stats-row { display: flex; gap: 10px; padding: 12px 20px; }
        .stat-box { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid #3d2b1f; border-radius: 10px; padding: 10px; text-align: center; }
        .stat-label { color: #8b949e; font-size: 9px; margin-bottom: 4px; }
        .stat-value { color: #facc15; font-size: 16px; font-weight: bold; }
        .main-area { padding: 10px 20px 30px; }
        .loading { text-align: center; padding: 40px; color: #8b949e; font-size: 13px; }
        .row { display: flex; align-items: center; background: rgba(0,0,0,0.4); border: 1px solid #3d2b1f; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; gap: 12px; }
        .row.top1 { border-color: #facc15; background: rgba(250,204,21,0.08); }
        .row.top2 { border-color: #94a3b8; background: rgba(148,163,184,0.06); }
        .row.top3 { border-color: #cd7f32; background: rgba(205,127,50,0.06); }
        .rank { font-size: 20px; width: 30px; text-align: center; flex-shrink: 0; }
        .info { flex: 1; min-width: 0; }
        .email { font-size: 11px; color: #facc15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sub { font-size: 9px; color: #8b949e; margin-top: 3px; }
        .hashrate { text-align: right; flex-shrink: 0; }
        .hash-val { font-size: 16px; font-weight: bold; color: #a78bfa; }
        .hash-label { font-size: 9px; color: #8b949e; }
        .bar-wrap { height: 3px; background: #3d2b1f; border-radius: 2px; margin-top: 6px; }
        .bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #a78bfa, #facc15); }
        .updated { text-align: center; color: #3d2b1f; font-size: 10px; padding: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <span>⚡ Hashrate Top</span>
        <button class="refresh-btn" onclick="safeLoad()">↻ Refresh</button>
    </div>

    <div class="stats-row">
        <div class="stat-box">
            <div class="stat-label">Total Players</div>
            <div class="stat-value" id="s-players">—</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Total GH/S</div>
            <div class="stat-value" id="s-total">—</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Active GH/S</div>
            <div class="stat-value" id="s-active">—</div>
        </div>
    </div>
    <div class="stats-row" style="padding: 0 20px 10px;">
        <div class="stat-box">
            <div class="stat-label">Today's LTC Rate</div>
            <div class="stat-value" id="s-rate" style="color:#a78bfa; font-size:13px;">— LTC / GH/S / HR</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Today's USDT Rate</div>
            <div class="stat-value" id="s-rate-day" style="color:#22c55e; font-size:13px;">—</div>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-box">
            <div class="stat-label">0–1 GH/S</div>
            <div class="stat-value" id="s-bucket-0" style="color:#8b949e;">—</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">1–2 GH/S</div>
            <div class="stat-value" id="s-bucket-1" style="color:#a78bfa;">—</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">2+ GH/S</div>
            <div class="stat-value" id="s-bucket-2" style="color:#22c55e;">—</div>
        </div>
    </div>

    <div class="main-area" id="main-area">
        <div class="loading">Loading...</div>
    </div>

    <div class="updated" id="updated"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js';
        import { getFirestore, getDocs, collection, query, orderBy, limit, doc, getDoc } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBWMTTJo-iBtS7xxM3mjLWaTC0EOfl6MHw",
            authDomain: "crypto-miner-game-f45dc.firebaseapp.com",
            projectId: "crypto-miner-game-f45dc",
            storageBucket: "crypto-miner-game-f45dc.firebasestorage.app",
            messagingSenderId: "33690622473",
            appId: "1:33690622473:web:f80f6b836c15034e07f6d8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // NOTE: this reads the public-safe `leaderboard_public` collection —
        // no email, no coins/ltc balances. That data is mirrored there by
        // api/sync-mining.js. No Firebase Auth/sign-in is needed here since
        // the collection is meant to be openly readable.
        async function load() {
            document.getElementById('main-area').innerHTML = '<div class="loading">Loading...</div>';

            try {
                const q = query(collection(db, 'leaderboard_public'), orderBy('hashrate', 'desc'), limit(100));
                const snap = await getDocs(q);
                const now = Date.now();
                const users = [];

                snap.forEach(d => {
                    const data = d.data();
                    if (!data.hashrate || data.hashrate <= 0) return;
                    users.push({
                        name: data.display_name || 'Player',
                        level: data.level || 1,
                        hashrate: data.hashrate || 0,
                        nano: data.miner_nano != null ? data.miner_nano : null,
                        // Computed live (claimed within last 24h) instead of
                        // trusting a stored is_active flag that only updates
                        // when that player happens to sync again.
                        isActive: !!data.last_claim_ms && (now - data.last_claim_ms) < 86400000,
                    });
                });

                const maxHash = users[0]?.hashrate || 1;
                const totalHash = users.reduce((s, u) => s + u.hashrate, 0);
                const activeHash = users.filter(u => u.isActive).reduce((s, u) => s + u.hashrate, 0);

                document.getElementById('s-players').innerText = users.length;
                document.getElementById('s-total').innerText = Math.round(totalHash * 10) / 10;
                document.getElementById('s-active').innerText = Math.round(activeHash * 10) / 10;

                const bucket0 = users.filter(u => u.hashrate >= 0 && u.hashrate < 1).length;
                const bucket1 = users.filter(u => u.hashrate >= 1 && u.hashrate < 2).length;
                const bucket2 = users.filter(u => u.hashrate >= 2).length;
                document.getElementById('s-bucket-0').innerText = bucket0;
                document.getElementById('s-bucket-1').innerText = bucket1;
                document.getElementById('s-bucket-2').innerText = bucket2;

                // This doc (stats/global) is only rewritten by
                // refreshGlobalStats() in api/sync-mining.js, which is now
                // throttled to run at most once per hour. Its updatedAt
                // field is therefore the real "leaderboard last recomputed"
                // time — unlike the page-load timestamp this used to show.
                let statsUpdatedMs = null;
                try {
                    const globalSnap = await getDoc(doc(db, 'stats', 'global'));
                    const g = globalSnap.exists() ? globalSnap.data() : {};
                    const usdtPool = g.usdt_pool != null ? g.usdt_pool : null;
                    const ltcPool  = g.ltc_pool  != null ? g.ltc_pool  : null;
                    const activeUsdt = g.activeHashrateUsdt || 0;
                    const activeLtc  = g.activeHashrateLtc  || 0;

                    const ltcPerHour  = (ltcPool  != null && activeLtc  > 0) ? Math.round(ltcPool  / (24 * activeLtc)  * 1000) / 1000 : 2.5;
                    const usdtPerHour = (usdtPool != null && activeUsdt > 0) ? Math.round(usdtPool / (24 * activeUsdt) * 1000) / 1000 : 1.1;
                    document.getElementById('s-rate').innerText = ltcPerHour + ' LTC/GH/S/HR';
                    document.getElementById('s-rate-day').innerText = usdtPerHour + ' USDT/GH/S/HR';

                    statsUpdatedMs = g.updatedAt?.toMillis ? g.updatedAt.toMillis() : null;
                } catch(e) {
                    document.getElementById('s-rate').innerText = '2.5 LTC/GH/S/HR';
                    document.getElementById('s-rate-day').innerText = '1.1 USDT/GH/S/HR';
                }

                if (statsUpdatedMs) {
                    document.getElementById('updated').innerText = 'Leaderboard updated: ' + new Date(statsUpdatedMs).toLocaleString();
                } else {
                    document.getElementById('updated').innerText = 'Leaderboard update time unavailable';
                }

                if (users.length === 0) {
                    document.getElementById('main-area').innerHTML = '<div class="loading">No players yet</div>';
                    return;
                }

                const medals = ['🥇', '🥈', '🥉'];
                let html = '';

                users.forEach((u, i) => {
                    const rank = i < 3 ? medals[i] : `#${i + 1}`;
                    const cls = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
                    const pct = Math.round(u.hashrate / maxHash * 100);
                    const nameShort = u.name.length > 28 ? u.name.substring(0, 25) + '...' : u.name;
                    const activeDot = u.isActive ? '<span style="color:#22c55e;">● Active</span>' : '<span style="color:#ef4444;">● Inactive</span>';

                    html += `
                    <div class="row ${cls}">
                        <div class="rank">${rank}</div>
                        <div class="info">
                            <div class="email">${nameShort} <span style="color:#facc15;">· LVL ${u.level}</span></div>
                            <div class="sub">${activeDot}${u.nano != null ? ' · Miners: ' + u.nano : ''}</div>
                            <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%"></div></div>
                        </div>
                        <div class="hashrate">
                            <div class="hash-val">${u.hashrate}</div>
                            <div class="hash-label">GH/S</div>
                        </div>
                    </div>`;
                });

                document.getElementById('main-area').innerHTML = html;

            } catch(e) {
                document.getElementById('main-area').innerHTML = `<div class="loading">Error: ${e.message}</div>`;
            }
        }

        window.load = load;

        // Refresh button in the header calls this instead of load() directly,
        // so it can never be used to skip the password gate below.
        window.safeLoad = function() {
            if (sessionStorage.getItem('lb_auth') === 'ok') {
                load();
            }
        };

        // Простой пароль для доступа к странице (не защита данных — они и
        // так публично-безопасны, просто чтобы посторонние не заходили).
        const LB_PASSWORD = 'kr1stal2024';
        const saved = sessionStorage.getItem('lb_auth');
        if (saved === 'ok') {
            load();
        } else {
            document.getElementById('main-area').innerHTML = `
                <div style="text-align:center; padding: 40px 20px;">
                    <div style="font-size:36px; margin-bottom:16px;">🔒</div>
                    <div style="color:#8b949e; font-size:12px; margin-bottom:16px;">ENTER PASSWORD</div>
                    <input id="pwd-input" type="password" placeholder="Password"
                        style="background:#1a1613;border:1px solid #3d2b1f;color:white;padding:10px 14px;border-radius:8px;font-family:monospace;font-size:14px;width:200px;outline:none;text-transform:none;"
                        onkeydown="if(event.key==='Enter') checkPwd()">
                    <br><br>
                    <button onclick="checkPwd()" style="background:#facc15;color:#1a1613;border:none;padding:10px 24px;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer;font-family:monospace;text-transform:uppercase;">Enter</button>
                    <div id="pwd-err" style="color:#ef4444;font-size:11px;margin-top:10px;"></div>
                </div>`;
        }

        window.checkPwd = function() {
            const val = document.getElementById('pwd-input').value;
            if (val === LB_PASSWORD) {
                sessionStorage.setItem('lb_auth', 'ok');
                load();
            } else {
                document.getElementById('pwd-err').innerText = 'Wrong password!';
            }
        }
    </script>
</body>
</html>
