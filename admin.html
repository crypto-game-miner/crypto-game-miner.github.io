<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin · Crypto Miner</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background: #0d0b0a;
    color: #eee;
    padding-bottom: 40px;
  }
  .login-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .login-box {
    background: #1a1613;
    border: 1px solid #3d2b1f;
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .login-box h1 { color: #facc15; font-size: 20px; margin-bottom: 20px; }
  .login-box input {
    width: 100%;
    padding: 12px;
    margin-bottom: 14px;
    background: #0d0b0a;
    border: 1px solid #3d2b1f;
    border-radius: 8px;
    color: #eee;
    font-family: inherit;
  }
  .login-box button {
    width: 100%;
    padding: 12px;
    background: #facc15;
    border: none;
    border-radius: 8px;
    color: #1a1613;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
  }
  #login-error { color: #f87171; font-size: 13px; margin-top: 10px; display: none; }

  header {
    padding: 20px 16px 10px;
  }
  header h1 { color: #facc15; font-size: 22px; margin: 0 0 14px; }
  .tabs { display: flex; gap: 8px; }
  .tab-btn {
    flex: 1;
    padding: 10px;
    background: #1a1613;
    border: 1px solid #3d2b1f;
    border-radius: 8px;
    color: #aaa;
    font-family: inherit;
    cursor: pointer;
  }
  .tab-btn.active { background: #facc15; color: #1a1613; font-weight: bold; border-color: #facc15; }

  #req-list { padding: 0 16px 24px; display: flex; flex-direction: column; gap: 14px; }
  .req-card {
    background: #1a1613;
    border: 1px solid #3d2b1f;
    border-radius: 10px;
    padding: 14px;
  }
  .req-card img {
    width: 100%;
    max-width: 320px;
    height: auto;
    border-radius: 6px;
    border: 1px solid #3d2b1f;
    margin-bottom: 10px;
    background: #000;
  }
  .req-field { font-size: 13px; margin-bottom: 4px; color: #bbb; word-break: break-all; }
  .req-field b { color: #eee; }
  .req-actions { display: flex; gap: 8px; margin-top: 12px; }
  .req-actions button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-approve { background: #4ade80; color: #0d0b0a; }
  .btn-reject { background: #f87171; color: #0d0b0a; }
  .status-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 8px;
  }
  .status-pending { background: #facc15; color: #1a1613; }
  .status-approved { background: #4ade80; color: #1a1613; }
  .status-rejected { background: #f87171; color: #1a1613; }
  .empty-msg { text-align: center; color: #666; padding: 40px 0; }

  #admin-panel { display: none; }
</style>
</head>
<body>

<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <h1>🔒 ADMIN LOGIN</h1>
    <input type="password" id="pwd-input" placeholder="Password" onkeydown="if(event.key==='Enter') checkPwd()">
    <button onclick="checkPwd()">Enter</button>
    <div id="login-error">Wrong password.</div>
  </div>
</div>

<div id="admin-panel">
  <header>
    <h1>📋 AD REQUESTS</h1>
    <div class="tabs">
      <button class="tab-btn active" id="tab-pending" onclick="switchTab('pending')">Pending</button>
      <button class="tab-btn" id="tab-approved" onclick="switchTab('approved')">Approved</button>
      <button class="tab-btn" id="tab-rejected" onclick="switchTab('rejected')">Rejected</button>
    </div>
  </header>
  <div id="req-list"></div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import {
    getFirestore, collection, query, where, orderBy,
    getDocs, doc, updateDoc
  } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "crypto-miner-game.firebaseapp.com",
    projectId: "crypto-miner-game",
    storageBucket: "crypto-miner-game.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const ADMIN_PASSWORD = 'kr1stal2024'; // ⚠️ client-side only, not real security — see notes below

  let currentTab = 'pending';

  window.checkPwd = function () {
    const input = document.getElementById('pwd-input').value;
    if (input === ADMIN_PASSWORD) {
      document.getElementById('login-wrap').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
      loadRequests(currentTab);
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  };

  window.switchTab = function (tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    loadRequests(tab);
  };

  async function loadRequests(status) {
    const list = document.getElementById('req-list');
    list.innerHTML = '<div class="empty-msg">Loading...</div>';

    try {
      const q = query(
        collection(db, 'ad_requests'),
        where('status', '==', status),
        orderBy('createdAt', 'desc')
      );
      const snap = await getDocs(q);

      if (snap.empty) {
        list.innerHTML = '<div class="empty-msg">No requests here.</div>';
        return;
      }

      list.innerHTML = '';
      snap.forEach(docSnap => {
        const d = docSnap.data();
        const id = docSnap.id;
        const card = document.createElement('div');
        card.className = 'req-card';
        card.innerHTML = `
          <span class="status-badge status-${status}">${status.toUpperCase()}</span>
          <img src="${d.bannerUrl || ''}" alt="banner preview" onerror="this.style.display='none'">
          <div class="req-field"><b>Banner URL:</b> ${d.bannerUrl || '-'}</div>
          <div class="req-field"><b>Click URL:</b> ${d.clickUrl || '-'}</div>
          <div class="req-field"><b>Contact:</b> ${d.contactEmail || '-'}</div>
          <div class="req-field"><b>Days:</b> ${d.days || '-'}</div>
          <div class="req-field"><b>Currency:</b> ${d.currency || '-'}</div>
          <div class="req-field"><b>UID:</b> ${d.uid || '-'}</div>
          ${status === 'pending' ? `
          <div class="req-actions">
            <button class="btn-approve" onclick="approve('${id}')">✅ Approve</button>
            <button class="btn-reject" onclick="reject('${id}')">❌ Reject</button>
          </div>` : ''}
        `;
        list.appendChild(card);
      });
    } catch (e) {
      list.innerHTML = `<div class="empty-msg">Error loading requests: ${e.message}</div>`;
      console.error(e);
    }
  }

  window.approve = async function (reqId) {
    if (!confirm('Approve this banner? It will go live immediately.')) return;
    try {
      await updateDoc(doc(db, 'ad_requests', reqId), { status: 'approved' });
      alert('✅ Banner approved.');
      loadRequests(currentTab);
    } catch (e) {
      alert('Error: ' + e.message);
    }
  };

  window.reject = async function (reqId) {
    if (!confirm('Reject this banner?')) return;
    try {
      await updateDoc(doc(db, 'ad_requests', reqId), { status: 'rejected' });
      alert('❌ Banner rejected.');
      loadRequests(currentTab);
    } catch (e) {
      alert('Error: ' + e.message);
    }
  };
  // NOTE: the extra stray "}" that used to sit right here after this function
  // was the bug breaking the whole module (syntax error -> nothing loads,
  // including checkPwd -> login button did nothing). It has been removed.
</script>
</body>
</html>
