<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Ad Moderation</title>
    <style>
        html, body { margin: 0; padding: 0; background: #1a1613; color: white; font-family: 'Courier New', monospace; }
        body { padding: 16px 16px 40px; }
        .header { color: #facc15; font-size: 18px; font-weight: bold; margin-bottom: 16px; text-transform: uppercase; }
        .login-box { background: rgba(0,0,0,0.4); border: 1px solid #3d2b1f; border-radius: 10px; padding: 20px; max-width: 320px; margin: 60px auto; }
        .login-box input { width: 100%; box-sizing: border-box; background: #0d0d0d; border: 1px solid #3d2b1f; border-radius: 8px; color: white; padding: 10px; font-size: 14px; font-family: monospace; outline: none; margin-bottom: 12px; }
        .login-box button { background: #facc15; color: #1a1613; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; width: 100%; font-family: monospace; }
        #panel { display: none; }
        .card { background: rgba(0,0,0,0.4); border: 1px solid #3d2b1f; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .status-badge { font-size: 10px; padding: 3px 8px; border-radius: 10px; font-weight: bold; }
        .status-pending  { background: rgba(251,191,36,0.2); color: #fbbf24; border: 1px solid #fbbf24; }
        .status-active   { background: rgba(34,197,94,0.2);  color: #22c55e; border: 1px solid #22c55e; }
        .status-rejected { background: rgba(239,68,68,0.2);  color: #ef4444; border: 1px solid #ef4444; }
        .banner-img { width: 100%; height: 50px; object-fit: contain; background: #0d0d0d; border-radius: 6px; margin: 8px 0; border: 1px dashed #3d2b1f; }
        .info-row { display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0; border-bottom: 1px solid #2a2015; }
        .info-row:last-child { border-bottom: none; }
        .info-row span:first-child { color: #8b949e; }
        .info-row a { color: #facc15; font-size: 11px; }
        .btn-row { display: flex; gap: 8px; margin-top: 12px; }
        .btn-approve { background: #22c55e; color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; flex: 1; font-family: monospace; }
        .btn-reject  { background: #ef4444; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; flex: 1; font-family: monospace; }
        .btn-approve:disabled, .btn-reject:disabled { opacity: 0.5; cursor: not-allowed; }
        .views-input { background: #0d0d0d; border: 1px solid #facc15; border-radius: 6px; color: white; padding: 6px 10px; font-size: 13px; font-family: monospace; width: 70px; outline: none; }
        .days-input { background: #0d0d0d; border: 1px solid #facc15; border-radius: 6px; color: white; padding: 8px 10px; font-size: 13px; font-family: monospace; box-sizing: border-box; outline: none; }
        .empty { text-align: center; color: #555; padding: 40px 0; font-size: 14px; }
        .tab-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .tab { padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; border: 1px solid #3d2b1f; background: transparent; color: #8b949e; font-family: monospace; text-transform: uppercase; }
        .tab.active { background: #facc15; color: #1a1613; border-color: #facc15; }
    </style>
</head>
<body>

<!-- Login -->
<div id="login-box" class="login-box">
    <div style="color:#facc15; font-size:16px; font-weight:bold; margin-bottom:16px; text-align:center;">🔐 Admin Panel</div>
    <input type="password" id="pwd" placeholder="Password" onkeydown="if(event.key==='Enter')checkPwd()">
    <button onclick="checkPwd()">Enter</button>
</div>

<!-- Panel -->
<div id="panel">
    <div class="header">📢 Ad Moderation</div>
    <div class="tab-row">
        <button class="tab active" onclick="switchTab('pending')">⏳ Pending</button>
        <button class="tab" onclick="switchTab('active')">✅ Active</button>
        <button class="tab" onclick="switchTab('rejected')">❌ Rejected</button>
        <button class="tab" onclick="switchTab('stats')">📊 Stats</button>
        <button class="tab" onclick="switchTab('miners')">⛏️ Miners</button>
    </div>
    <div id="cards-container"></div>
    <div id="stats-container" style="display:none;"></div>
    <div id="miners-container" style="display:none;"></div>
</div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js';
    import { getAuth, signInAnonymously, inMemoryPersistence, setPersistence } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js';
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc, addDoc, deleteDoc, query, where, orderBy } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js';

    // Пароль больше НЕ хранится здесь. Введённое значение проверяется на
    // сервере (api/moderate-ad.js, action: 'verify') против process.env.ADMIN_SECRET.
    // Если проверка прошла, сохраняем его в памяти вкладки (не на диск),
    // чтобы использовать в последующих authenticated-запросах (approve/reject/...).
    let ADMIN_PASSWORD = null;

    const firebaseConfig = {
        apiKey: "AIzaSyBWMTTJo-iBtS7xxM3mjLWaTC0EOfl6MHw",
        authDomain: "crypto-miner-game-f45dc.firebaseapp.com",
        projectId: "crypto-miner-game-f45dc",
        storageBucket: "crypto-miner-game-f45dc.firebasestorage.app",
        messagingSenderId: "33690622473",
        appId: "1:33690622473:web:f80f6b836c15034e07f6d8"
    };

    // ВАЖНО: именованный вторичный app ("admin-panel"), а НЕ default.
    // Это изолирует Auth-сессию админки от игровой сессии игрока на этом
    // же устройстве/браузере: раньше signInAnonymously() тут подменял
    // (сбрасывал) залогиненную сессию игрока — гостевую или Google —
    // потому что Firebase Auth хранит сессию на уровне origin, а не
    // страницы, и оба файла использовали один и тот же default app.
    const app  = initializeApp(firebaseConfig, 'admin-panel');
    const auth = getAuth(app);
    const db   = getFirestore(app);

    let currentTab = 'pending';

    window.checkPwd = async function() {
        const pwd = document.getElementById('pwd').value;

        try {
            const res = await fetch('/api/moderate-ad', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ secret: pwd, action: 'verify' })
            });
            const data = await res.json();
            if (!data.success) {
                alert('Wrong password');
                return;
            }
        } catch(e) {
            alert('Auth error: ' + e.message);
            return;
        }

        ADMIN_PASSWORD = pwd; // храним в памяти вкладки для последующих запросов

        try {
            // Сессию админки не сохраняем на диск — только на время
            // вкладки, и она живёт в отдельном app, не трогая игрока.
            await setPersistence(auth, inMemoryPersistence);
            await signInAnonymously(auth); // satisfies "request.auth != null" in Firestore rules
        } catch(e) {
            alert('Auth error: ' + e.message);
            return;
        }
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        loadRequests('pending');
    };

    window.switchTab = function(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('cards-container').style.display = 'none';
        document.getElementById('stats-container').style.display = 'none';
        document.getElementById('miners-container').style.display = 'none';
        if (tab === 'stats') {
            document.getElementById('stats-container').style.display = 'block';
            loadStats();
        } else if (tab === 'miners') {
            document.getElementById('miners-container').style.display = 'block';
            loadMinersConfig();
        } else {
            document.getElementById('cards-container').style.display = 'block';
            loadRequests(tab);
        }
    };

    async function loadRequests(status) {
        const container = document.getElementById('cards-container');
        container.innerHTML = '<div class="empty">Loading...</div>';

        try {
            const q = query(collection(db, 'ad_requests'), where('status', '==', status), orderBy('createdAt', 'desc'));
            const snap = await getDocs(q);

            if (snap.empty) {
                container.innerHTML = '<div class="empty">No ' + status + ' requests</div>';
                return;
            }

            container.innerHTML = '';
            for (const docSnap of snap.docs) {
                const d = docSnap.data();
                const id = docSnap.id;
                const date = d.createdAt?.toDate?.()?.toLocaleDateString() || '—';

                // Для активных баннеров подтягиваем views_shown/views_total из ad_slots
                let viewsRow = '';
                if (status === 'active') {
                    try {
                        const slotSnap = await getDocs(query(collection(db, 'ad_slots'), where('req_id', '==', id)));
                        if (slotSnap.empty) {
                            viewsRow = `<div class="info-row"><span>Views</span><span>—</span></div>`;
                        } else {
                            const slot = slotSnap.docs[0].data();
                            const shown = slot.views_shown || 0;
                            const total = slot.views_total || 0;
                            const slotStatus = slot.status || 'active';
                            viewsRow = `<div class="info-row"><span>Views shown</span><span>${shown} / ${total}${slotStatus === 'completed' ? ' (done)' : ''}</span></div>`;
                        }
                    } catch(e) { viewsRow = `<div class="info-row"><span>Views shown</span><span>—</span></div>`; }
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <span style="color:#facc15; font-size:13px; font-weight:bold;">${d.contact || '—'}</span>
                        <span class="status-badge status-${d.status}">${d.status}</span>
                    </div>
                    <img class="banner-img" src="${d.banner_url}" onerror="this.src=''" alt="banner">
                    <div class="info-row"><span>Link</span><a href="${d.click_url}" target="_blank">Open ↗</a></div>
                    <div class="info-row"><span>Views requested</span><span>${d.views_purchased ?? '—'}</span></div>
                    <div class="info-row"><span>Price</span><span>${d.cost} USDT coins</span></div>
                    <div class="info-row"><span>Submitted</span><span>${date}</span></div>
                    ${viewsRow}
                    ${status === 'pending' ? `
                    <div class="btn-row" style="align-items:center;">
                        <span style="font-size:11px; color:#8b949e;">Views to activate:</span>
                        <input type="number" class="views-input" id="views-${id}" value="${d.views_purchased ?? 1}" min="1">
                        <button class="btn-approve" onclick="approve('${id}', '${d.banner_url}', '${d.click_url}')">✅ Approve</button>
                        <button class="btn-reject" onclick="reject('${id}')">❌ Reject</button>
                    </div>` : ''}
                    ${status === 'active' ? `
                    <div class="btn-row">
                        <button class="btn-reject" onclick="revoke('${id}')">↩️ Revoke (back to pending)</button>
                    </div>` : ''}
                `;
                container.appendChild(card);
            }
        } catch(e) {
            container.innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
        }
    }

    window.approve = async function(reqId, bannerUrl, clickUrl) {
        const views = parseInt(document.getElementById('views-' + reqId).value) || 1;
        try {
            const res = await fetch('/api/moderate-ad', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ secret: ADMIN_PASSWORD, action: 'approve', reqId, views, bannerUrl, clickUrl })
            });
            const data = await res.json();
            if (!data.success) { alert(data.error || 'Error approving'); return; }
            alert('✅ Banner approved! Active for ' + views + ' views.');
            loadRequests(currentTab);
        } catch(e) {
            alert('Error: ' + e.message);
        }
    };

    window.reject = async function(reqId) {
        if (!confirm('Reject this banner?')) return;
        try {
            const res = await fetch('/api/moderate-ad', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ secret: ADMIN_PASSWORD, action: 'reject', reqId })
            });
            const data = await res.json();
            if (!data.success) { alert(data.error || 'Error rejecting'); return; }
            alert('❌ Banner rejected.');
            loadRequests(currentTab);
        } catch(e) {
            alert('Error: ' + e.message);
        }
    };

    window.revoke = async function(reqId) {
        if (!confirm('Revoke this approval? The banner will stop showing and the request goes back to Pending.')) return;
        try {
            const res = await fetch('/api/moderate-ad', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ secret: ADMIN_PASSWORD, action: 'revoke', reqId })
            });
            const data = await res.json();
            if (!data.success) { alert(data.error || 'Error revoking'); return; }
            alert('↩️ Approval revoked, moved back to Pending.');
            loadRequests(currentTab);
        } catch(e) {
            alert('Error: ' + e.message);
        }
    };

    const BASE_USDT_RATE = 1.1;
    const BASE_LTC_RATE  = 2.5;

    function todayKey() { return new Date().toISOString().slice(0, 10); }
    function yesterdayKey() { return new Date(Date.now() - 86400000).toISOString().slice(0, 10); }

    // Conversion to REAL money, for admin's own reference only — has
    // nothing to do with in-game rates above.
    // USDT Coins: fixed, since real USDT ≈ $1 always (100 coins = $0.0001).
    const USDT_COIN_TO_REAL_USD = 0.000001;
    // LTC Coins: 1 in-game coin = 1 real litoshi (0.00000001 LTC), so its
    // USD value depends on the live LTC market price — fetched below.
    const LTC_COIN_TO_LTC = 0.00000001;

    async function fetchLtcPriceUsd() {
        try {
            const resp = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=litecoin&vs_currencies=usd');
            const data = await resp.json();
            return data.litecoin?.usd || null;
        } catch(e) {
            return null;
        }
    }

    async function loadStats() {
        const container = document.getElementById('stats-container');
        container.innerHTML = '<div class="empty">Loading...</div>';

        try {
            const [dailySnap, yesterdaySnap, globalSnap, ltcPriceUsd] = await Promise.all([
                getDoc(doc(db, 'stats', 'daily_' + todayKey())),
                getDoc(doc(db, 'stats', 'daily_' + yesterdayKey())),
                getDoc(doc(db, 'stats', 'global')),
                fetchLtcPriceUsd(),
            ]);

            const d = dailySnap.exists() ? dailySnap.data() : {};
            const usdtClaims = d.usdt_from_claims || 0;
            const usdtMining = d.usdt_from_mining || 0;
            const ltcMining  = d.ltc_from_mining  || 0;

            const y = yesterdaySnap.exists() ? yesterdaySnap.data() : {};
            const yUsdtClaims = y.usdt_from_claims || 0;
            const yUsdtMining = y.usdt_from_mining || 0;
            const yLtcMining  = y.ltc_from_mining  || 0;

            function realUsdValue(usdtCoins, ltcCoins) {
                const usdtPart = usdtCoins * USDT_COIN_TO_REAL_USD;
                const ltcPart  = ltcPriceUsd != null ? (ltcCoins * LTC_COIN_TO_LTC * ltcPriceUsd) : 0;
                return usdtPart + ltcPart;
            }

            const priceNote = ltcPriceUsd != null
                ? `LTC price: $${ltcPriceUsd.toLocaleString()} (live, CoinGecko)`
                : `⚠️ Couldn't fetch live LTC price — LTC portion excluded from $ totals below`;

            const g = globalSnap.exists() ? globalSnap.data() : {};
            const usdtPool = g.usdt_pool != null ? g.usdt_pool : null;
            const ltcPool  = g.ltc_pool  != null ? g.ltc_pool  : null;
            const activeUsdt = g.activeHashrateUsdt || 0;
            const activeLtc  = g.activeHashrateLtc  || 0;
            const rewardGuest  = g.usdt_reward_guest  != null ? g.usdt_reward_guest  : 4;
            const rewardLogged = g.usdt_reward_logged != null ? g.usdt_reward_logged : 5;
            const dailyLinkUrl = g.daily_link_url || '';
            const withdrawMinUsdt = g.withdraw_min_usdt != null ? g.withdraw_min_usdt : 200;
            const withdrawMaxUsdt = g.withdraw_max_usdt != null ? g.withdraw_max_usdt : 700;
            const withdrawMinLtc  = g.withdraw_min_ltc  != null ? g.withdraw_min_ltc  : 400;
            const withdrawMaxLtc  = g.withdraw_max_ltc  != null ? g.withdraw_max_ltc  : 1500;

            const effUsdtRate = (usdtPool != null && activeUsdt > 0) ? (usdtPool / (24 * activeUsdt)) : BASE_USDT_RATE;
            const effLtcRate  = (ltcPool  != null && activeLtc  > 0) ? (ltcPool  / (24 * activeLtc))  : BASE_LTC_RATE;

            container.innerHTML = `
                <div class="card">
                    <div style="color:#8b949e; font-size:13px; font-weight:bold; margin-bottom:10px;">✅ YESTERDAY (${yesterdayKey()}) — complete day</div>
                    <div class="info-row"><span>USDT from Claims</span><span>${yUsdtClaims.toFixed(2)}</span></div>
                    <div class="info-row"><span>USDT from Mining</span><span>${yUsdtMining.toFixed(2)}</span></div>
                    <div class="info-row"><span>Total USDT earned (claims+mining)</span><span style="color:#facc15;">${(yUsdtClaims + yUsdtMining).toFixed(2)}</span></div>
                    <div class="info-row"><span>LTC from Mining</span><span>${yLtcMining.toFixed(4)}</span></div>
                    <div class="info-row"><span>💵 Real $ value paid out</span><span style="color:#22c55e;">$${realUsdValue(yUsdtClaims + yUsdtMining, yLtcMining).toFixed(6)}</span></div>
                </div>
                <div class="card">
                    <div style="color:#facc15; font-size:13px; font-weight:bold; margin-bottom:10px;">📅 TODAY (${todayKey()}) — live, still counting</div>
                    <div class="info-row"><span>USDT from Claims</span><span>${usdtClaims.toFixed(2)}</span></div>
                    <div class="info-row"><span>USDT from Mining</span><span>${usdtMining.toFixed(2)}</span></div>
                    <div class="info-row"><span>Total USDT earned (claims+mining)</span><span style="color:#facc15;">${(usdtClaims + usdtMining).toFixed(2)}</span></div>
                    <div class="info-row"><span>LTC from Mining</span><span>${ltcMining.toFixed(4)}</span></div>
                    <div class="info-row"><span>💵 Real $ value paid out</span><span style="color:#22c55e;">$${realUsdValue(usdtClaims + usdtMining, ltcMining).toFixed(6)}</span></div>
                    <div style="font-size:9px; color:#8b949e; margin-top:8px;">${priceNote}</div>
                </div>
                <div class="card">
                    <div style="color:#facc15; font-size:13px; font-weight:bold; margin-bottom:10px;">🎟️ CLAIM REWARDS</div>
                    <div style="font-size:10px; color:#8b949e; margin-bottom:10px;">
                        USDT paid out per faucet claim. Guests (no Google linked) get one rate, logged-in users get another. This is usually the biggest cost driver — bigger than mining.
                    </div>
                    <label style="font-size:11px; color:#8b949e; display:block; margin-bottom:4px;">Guest reward (per claim)</label>
                    <input type="number" id="reward-guest-input" class="days-input" style="width:100%; margin-bottom:10px;" step="0.5" min="0" value="${rewardGuest}">
                    <label style="font-size:11px; color:#8b949e; display:block; margin-bottom:4px;">Logged-in reward (per claim)</label>
                    <input type="number" id="reward-logged-input" class="days-input" style="width:100%; margin-bottom:12px;" step="0.5" min="0" value="${rewardLogged}">
                    <button class="btn-approve" style="width:100%;" onclick="saveClaimRewards()">💾 Save Rewards</button>
                </div>
                <div class="card">
                    <div style="color:#a78bfa; font-size:13px; font-weight:bold; margin-bottom:10px;">🔗 DAILY BONUS LINK</div>
                    <div style="font-size:10px; color:#8b949e; margin-bottom:10px;">
                        URL shown for the "Daily Bonus Link" task on the Tasks page (+0.17 GH/s, once per 24h). Change it any time — takes effect for all users immediately, no redeploy needed.
                    </div>
                    <label style="font-size:11px; color:#8b949e; display:block; margin-bottom:4px;">Link URL</label>
                    <input type="text" id="daily-link-input" class="days-input" style="width:100%; margin-bottom:12px;" value="${dailyLinkUrl}" placeholder="https://...">
                    <button class="btn-approve" style="width:100%;" onclick="saveDailyLink()">💾 Save Link</button>
                </div>
                <div class="card">
                    <div style="color:#facc15; font-size:13px; font-weight:bold; margin-bottom:10px;">💸 WITHDRAW LIMITS</div>
                    <div style="font-size:10px; color:#8b949e; margin-bottom:10px;">
                        Min amount per single withdrawal, and max total per day, for each currency. Enforced server-side in api/withdraw.js — not just client-side.
                    </div>
                    <label style="font-size:11px; color:#8b949e; display:block; margin-bottom:4px;">USDT — Min per withdrawal</label>
                    <input type="number" id="wd-min-usdt-input" class="days-input" style="width:100%; margin-bottom:10px;" step="1" min="0" value="${withdrawMinUsdt}">
                    <label style="font-size:11px; color:#8b949e; display:block; margin-bottom:4px;">USDT — Max per day</label>
                    <input type="number" id="wd-max-usdt-input" class="days-input" style="width:100%; margin-bottom:10px;" step="1" min="0" value="${withdrawMaxUsdt}">
                    <label style="font-size:11px; color:#8b949e; display:block; margin-bottom:4px;">LTC — Min per withdrawal</label>
                    <input type="number" id="wd-min-ltc-input" class="days-input" style="width:100%; margin-bottom:10px;" step="1" min="0" value="${withdrawMinLtc}">
                    <label style="font-size:11px; color:#8b949e; display:block; margin-bottom:4px;">LTC — Max per day</label>
                    <input type="number" id="wd-max-ltc-input" class="days-input" style="width:100%; margin-bottom:12px;" step="1" min="0" value="${withdrawMaxLtc}">
                    <button class="btn-approve" style="width:100%;" onclick="saveWithdrawLimits()">💾 Save Withdraw Limits</button>
                </div>
                <div class="card">
                    <div style="color:#facc15; font-size:13px; font-weight:bold; margin-bottom:10px;">⚙️ DAILY POOLS (Mining only)</div>
                    <div class="info-row"><span>Active USDT-track Hashrate</span><span>${activeUsdt.toFixed(1)} GH/S</span></div>
                    <div class="info-row"><span>Active LTC-track Hashrate</span><span>${activeLtc.toFixed(1)} GH/S</span></div>
                    <div style="font-size:10px; color:#8b949e; margin:10px 0 4px;">
                        Set a daily budget per coin — it's divided across everyone currently mining that track, live. Leave blank to use the flat base rate (${BASE_USDT_RATE} USDT / ${BASE_LTC_RATE} LTC per GH/S/hr) instead of a budget. Does NOT affect claim rewards above.
                    </div>
                    <label style="font-size:11px; color:#8b949e; display:block; margin-bottom:4px;">USDT Pool / day (effective rate: ${effUsdtRate.toFixed(3)}/GH/S/hr)</label>
                    <input type="number" id="usdt-pool-input" class="days-input" style="width:100%; margin-bottom:10px;" step="1" min="0" value="${usdtPool != null ? usdtPool : ''}" placeholder="blank = base rate">
                    <label style="font-size:11px; color:#8b949e; display:block; margin-bottom:4px;">LTC Pool / day (effective rate: ${effLtcRate.toFixed(3)}/GH/S/hr)</label>
                    <input type="number" id="ltc-pool-input" class="days-input" style="width:100%; margin-bottom:12px;" step="1" min="0" value="${ltcPool != null ? ltcPool : ''}" placeholder="blank = base rate">
                    <button class="btn-approve" style="width:100%;" onclick="savePools()">💾 Save Pools</button>
                </div>
            `;
        } catch(e) {
            container.innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
        }
    }

    window.saveClaimRewards = async function() {

            });
            const data = await res.json();
            if (!data.success) { alert(data.error || 'Error saving rewards'); return; }

    async function loadMinersConfig() {
        const container = document.getElementById('miners-container');
        container.innerHTML = '<div class="empty">Loading...</div>';
        try {
            const snap = await getDoc(doc(db, 'stats', 'global'));
            const g = snap.exists() ? snap.data() : {};

            const nanoPrice = g.nano_price != null ? g.nano_price : 50;
            const nanoPower = g.nano_power != null ? g.nano_power : 0.1;
            const nanoMax   = g.nano_max   != null ? g.nano_max   : 10;
            const boxPrice  = g.box_price  != null ? g.box_price  : 40;
            const megaPower = g.mega_power != null ? g.mega_power : 0.2;
            const megaMax   = g.mega_max   != null ? g.mega_max   : 2;
            const t1c = g.box_odds_tier1_chance != null ? g.box_odds_tier1_chance : 35;
            const t1a = g.box_odds_tier1_amount != null ? g.box_odds_tier1_amount : 10;
            const t2c = g.box_odds_tier2_chance != null ? g.box_odds_tier2_chance : 30;
            const t2a = g.box_odds_tier2_amount != null ? g.box_odds_tier2_amount : 20;
            const t3c = g.box_odds_tier3_chance != null ? g.box_odds_tier3_chance : 15;
            const t3a = g.box_odds_tier3_amount != null ? g.box_odds_tier3_amount : 40;
            const megaChance = 100 - (t1c + t2c + t3c);

            container.innerHTML = `
                <div class="card">
                    <div style="color:#facc15; font-size:13px; font-weight:bold; margin-bottom:10px;">⛏️ NANOMINER X1</div>
                    <label style="font-size:11px; color:#8b949e; display:block; margin-bottom:4px;">Price (Game Coins)</label>
                    <input type="number" id="nano-price-input" class="days-input" style="width:100%; margin-bottom:10px;" step="1" min="1" value="${nanoPrice}">
                    <label style="font-size:11px; color:#8b949e; display:block; margin-bottom:4px;">Power (GH/s per unit)</label>
                    <input type="number" id="nano-power-input" class="days-input" style="width:100%; margin-bottom:10px;" step="0.01" min="0.01" value="${nanoPower}">
                    <label style="font-size:11px; color:#8b949e; display:block; margin-bottom:4px;">Max owned per account</label>
                    <input type="number" id="nano-max-input" class="days-input" style="width:100%; margin-bottom:12px;" step="1" min="1" value="${nanoMax}">
                </div>
                <div class="card">
                    <div style="color:#a78bfa; font-size:13px; font-weight:bold; margin-bottom:10px;">🎁 MYSTERY BOX</div>
                    <label style="font-size:11px; color:#8b949e; display:block; margin-bottom:4px;">Price (Game Coins)</label>
                    <input type="number" id="box-price-input" class="days-input" style="width:100%; margin-bottom:10px;" step="1" min="1" value="${boxPrice}">
                    <label style="font-size:11px; color:#8b949e; display:block; margin-bottom:4px;">MegaMiner Power (GH/s per unit)</label>
                    <input type="number" id="mega-power-input" class="days-input" style="width:100%; margin-bottom:10px;" step="0.01" min="0.01" value="${megaPower}">
                    <label style="font-size:11px; color:#8b949e; display:block; margin-bottom:4px;">MegaMiner Max owned per account</label>
                    <input type="number" id="mega-max-input" class="days-input" style="width:100%; margin-bottom:14px;" step="1" min="1" value="${megaMax}">

                    <div style="font-size:11px; color:#facc15; font-weight:bold; margin-bottom:8px;">Prize Odds (must total ≤100% — rest goes to MegaMiner)</div>
                    <div style="display:flex; gap:8px; margin-bottom:10px;">
                        <div style="flex:1;">
                            <label style="font-size:10px; color:#8b949e; display:block; margin-bottom:4px;">Tier 1 chance %</label>
                            <input type="number" id="t1c-input" class="days-input" style="width:100%;" step="1" min="0" max="100" value="${t1c}">
                        </div>
                        <div style="flex:1;">
                            <label style="font-size:10px; color:#8b949e; display:block; margin-bottom:4px;">Tier 1 coins</label>
                            <input type="number" id="t1a-input" class="days-input" style="width:100%;" step="1" min="0" value="${t1a}">
                        </div>
                    </div>
                    <div style="display:flex; gap:8px; margin-bottom:10px;">
                        <div style="flex:1;">
                            <label style="font-size:10px; color:#8b949e; display:block; margin-bottom:4px;">Tier 2 chance %</label>
                            <input type="number" id="t2c-input" class="days-input" style="width:100%;" step="1" min="0" max="100" value="${t2c}">
                        </div>
                        <div style="flex:1;">
                            <label style="font-size:10px; color:#8b949e; display:block; margin-bottom:4px;">Tier 2 coins</label>
                            <input type="number" id="t2a-input" class="days-input" style="width:100%;" step="1" min="0" value="${t2a}">
                        </div>
                    </div>
                    <div style="display:flex; gap:8px; margin-bottom:10px;">
                        <div style="flex:1;">
                            <label style="font-size:10px; color:#8b949e; display:block; margin-bottom:4px;">Tier 3 chance %</label>
                            <input type="number" id="t3c-input" class="days-input" style="width:100%;" step="1" min="0" max="100" value="${t3c}">
                        </div>
                        <div style="flex:1;">
                            <label style="font-size:10px; color:#8b949e; display:block; margin-bottom:4px;">Tier 3 coins</label>
                            <input type="number" id="t3a-input" class="days-input" style="width:100%;" step="1" min="0" value="${t3a}">
                        </div>
                    </div>
                    <div style="font-size:10px; color:#22c55e; margin-bottom:12px;">MegaMiner chance (auto): ${megaChance}%</div>
                    <button class="btn-approve" style="width:100%;" onclick="saveMinersConfig()">💾 Save Miners/Box Config</button>
                </div>
                <div class="card" style="border-color:#ef4444;">
                    <div style="color:#ef4444; font-size:13px; font-weight:bold; margin-bottom:10px;">🔧 ONE-TIME FIX</div>
                    <div style="font-size:10px; color:#8b949e; margin-bottom:12px;">
                        Removes old baked-in miner power (0.1/0.2 GH/s per unit, hardcoded before this panel existed) from every existing user's task_bonus_hashrate. Run this ONCE after deploying the live-power version of home.html/api/store.js — otherwise users who bought miners before will get their miner power counted twice. Safe to run more than once (it's a no-op the second time).
                    </div>
                    <button class="btn-reject" style="width:100%;" onclick="runMigration()">⚠️ Run Migration</button>
                </div>
            `;
        } catch(e) {
            container.innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
        }
    }

    window.saveMinersConfig = async function() {
        const storeConfig = {
            nanoPrice: document.getElementById('nano-price-input').value,
            nanoPower: document.getElementById('nano-power-input').value,
            nanoMax:   document.getElementById('nano-max-input').value,
            boxPrice:  document.getElementById('box-price-input').value,
            megaPower: document.getElementById('mega-power-input').value,
            megaMax:   document.getElementById('mega-max-input').value,
            tier1Chance: document.getElementById('t1c-input').value,
            tier1Amount: document.getElementById('t1a-input').value,
            tier2Chance: document.getElementById('t2c-input').value,
            tier2Amount: document.getElementById('t2a-input').value,
            tier3Chance: document.getElementById('t3c-input').value,
            tier3Amount: document.getElementById('t3a-input').value,
        };
        try {
            const res = await fetch('/api/moderate-ad', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ secret: ADMIN_PASSWORD, action: 'set_store_config', storeConfig })
            });
            const data = await res.json();
            if (!data.success) { alert(data.error || 'Error saving config'); return; }
            alert('✅ Miners/Box config updated.');
            loadMinersConfig();
        } catch(e) {
            alert('Error: ' + e.message);
        }
    };

    window.runMigration = async function() {
        if (!confirm('This will update task_bonus_hashrate for every existing user. Run once. Continue?')) return;
        try {
            const res = await fetch('/api/moderate-ad', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ secret: ADMIN_PASSWORD, action: 'migrate_fix_task_bonus' })
            });
            const data = await res.json();
            if (!data.success) { alert(data.error || 'Migration failed'); return; }
            alert(`✅ Fixed ${data.fixedCount} out of ${data.totalUsers} users.`);
        } catch(e) {
            alert('Error: ' + e.message);
        }
    };
</script>
