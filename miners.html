<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Miner — My Miners</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background-color: #1a1613; -webkit-user-select: none; color: white; font-family: 'Courier New', Courier, monospace; }
        #main-content { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        .header { padding: 15px 20px; font-weight: bold; color: #facc15; font-size: 18px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; text-transform: uppercase; }
        .main-area { flex: 1; padding: 15px 20px; overflow-y: auto; padding-bottom: 90px; }
        .total-card { background: rgba(0,0,0,0.4); border: 2px solid #facc15; border-radius: 12px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .total-label { color: #8b949e; font-size: 11px; text-transform: uppercase; margin-bottom: 4px; }
        .total-value { color: #facc15; font-size: 22px; font-weight: bold; }
        .total-sub { color: #a78bfa; font-size: 12px; margin-top: 2px; }
        .section-title { color: #8b949e; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .miner-row { background: rgba(0,0,0,0.4); border: 1px solid #3d2b1f; border-radius: 12px; padding: 14px 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; }
        .miner-row.active { border-color: #22c55e; }
        .miner-row.empty { border-color: #3d2b1f; opacity: 0.4; }
        .miner-svg { width: 48px; height: 48px; flex-shrink: 0; }
        .miner-info { flex: 1; }
        .miner-name { font-size: 13px; font-weight: bold; color: #facc15; text-transform: uppercase; }
        .miner-desc { font-size: 10px; color: #8b949e; margin-top: 2px; text-transform: uppercase; }
        .miner-badges { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .badge { background: rgba(0,0,0,0.3); border-radius: 6px; padding: 4px 8px; font-size: 10px; text-transform: uppercase; }
        .badge.green { color: #22c55e; border: 1px solid #22c55e33; }
        .badge.purple { color: #a78bfa; border: 1px solid #a78bfa33; }
        .badge.yellow { color: #facc15; border: 1px solid #facc1533; }
        .miner-count { text-align: right; flex-shrink: 0; }
        .count-num { font-size: 28px; font-weight: bold; color: #facc15; line-height: 1; }
        .count-max { font-size: 10px; color: #8b949e; text-transform: uppercase; }
        .empty-state { text-align: center; padding: 40px 20px; }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-text { color: #8b949e; font-size: 13px; text-transform: uppercase; }
        .empty-btn { display: inline-block; margin-top: 16px; background: #facc15; color: #1a1613; padding: 10px 24px; border-radius: 8px; font-weight: bold; font-size: 13px; text-decoration: none; text-transform: uppercase; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; z-index: 999; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #8b949e; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; width: 25%; cursor: pointer; text-transform: uppercase; }
        .nav-item.active { color: #facc15; }
        .nav-icon { font-size: 24px; margin-bottom: 3px; }
        body { text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="main-content">
        <div class="header">
            <a href="home.html" style="color:#facc15;text-decoration:none;font-size:20px;">←</a>
            <span>My Miners</span>
            <a href="store.html" style="color:#facc15;text-decoration:none;font-size:12px;font-weight:bold;">+ Buy</a>
        </div>

        <div class="main-area" id="main-area">
            <!-- Заполняется JS -->
        </div>

        <div class="nav-bar">
            <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
            <a href="index.html" class="nav-item"><span class="nav-icon">🚰</span>Faucet</a>
            <a href="tasks.html" class="nav-item"><span class="nav-icon">📋</span>Tasks</a>
            <a href="wallet.html" class="nav-item"><span class="nav-icon">👛</span>Wallet</a>
        </div>
    </div>

    <script>
        const MINERS = [
            {
                id: 'nano',
                key: 'miner_nano',
                name: 'NanoMiner X1',
                desc: 'Entry-level personal crypto miner',
                power: 0.1,
                max: 10,
                price: 50,
                svg: `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                  <rect x="4" y="18" width="56" height="28" rx="4" fill="#2a2a2a" stroke="#555" stroke-width="1.5"/>
                  <rect x="6" y="20" width="52" height="24" rx="3" fill="#1a1a1a"/>
                  <rect x="9" y="24" width="3" height="16" rx="1" fill="#333"/>
                  <rect x="14" y="24" width="3" height="16" rx="1" fill="#333"/>
                  <rect x="19" y="24" width="3" height="16" rx="1" fill="#333"/>
                  <rect x="26" y="23" width="14" height="18" rx="2" fill="#0f0f0f" stroke="#facc15" stroke-width="1"/>
                  <rect x="28" y="25" width="10" height="14" rx="1" fill="#1a1613"/>
                  <rect x="29" y="26" width="3" height="3" rx="0.5" fill="#facc15" opacity="0.8"/>
                  <rect x="33" y="26" width="3" height="3" rx="0.5" fill="#facc15" opacity="0.8"/>
                  <rect x="29" y="30" width="3" height="3" rx="0.5" fill="#f97316" opacity="0.9"/>
                  <rect x="33" y="30" width="3" height="3" rx="0.5" fill="#facc15" opacity="0.8"/>
                  <rect x="29" y="34" width="3" height="3" rx="0.5" fill="#facc15" opacity="0.6"/>
                  <rect x="33" y="34" width="3" height="3" rx="0.5" fill="#f97316" opacity="0.9"/>
                  <circle cx="48" cy="32" r="7" fill="#222" stroke="#444" stroke-width="1"/>
                  <circle cx="48" cy="32" r="5" fill="#1a1a1a"/>
                  <line x1="48" y1="27" x2="48" y2="37" stroke="#555" stroke-width="1"/>
                  <line x1="43" y1="32" x2="53" y2="32" stroke="#555" stroke-width="1"/>
                  <line x1="44.5" y1="28.5" x2="51.5" y2="35.5" stroke="#555" stroke-width="1"/>
                  <line x1="51.5" y1="28.5" x2="44.5" y2="35.5" stroke="#555" stroke-width="1"/>
                  <circle cx="48" cy="32" r="2" fill="#333"/>
                  <circle cx="10" cy="44" r="2" fill="#22c55e"/>
                  <rect x="10" y="46" width="44" height="4" rx="1" fill="#111" stroke="#333" stroke-width="0.5"/>
                  <rect x="13" y="47" width="5" height="2" rx="0.5" fill="#333"/>
                  <rect x="21" y="47" width="5" height="2" rx="0.5" fill="#333"/>
                  <rect x="29" y="47" width="5" height="2" rx="0.5" fill="#333"/>
                  <rect x="37" y="47" width="5" height="2" rx="0.5" fill="#333"/>
                  <rect x="45" y="47" width="5" height="2" rx="0.5" fill="#333"/>
                </svg>`
            }
            // Сюда в будущем добавятся новые майнеры
        ];

        const dailyRate = parseFloat(localStorage.getItem('dailyRate')) || 1.0;
        const LTC_PER_GH = 2.5;

        let totalPower = 0;
        let totalMiners = 0;
        let hasAny = false;

        const rows = MINERS.map(m => {
            const owned = Number(localStorage.getItem(m.key)) || 0;
            if (owned > 0) hasAny = true;
            const power = Math.round(owned * m.power * 10) / 10;
            const ltcPerHour = Math.round(power * LTC_PER_GH * dailyRate * 1000) / 1000;
            const ltcPerDay = Math.round(power * LTC_PER_GH * dailyRate * 24 * 1000) / 1000;
            totalPower += power;
            totalMiners += owned;

            return { m, owned, power, ltcPerHour, ltcPerDay };
        });

        const area = document.getElementById('main-area');

        if (!hasAny) {
            area.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">⛏️</div>
                    <div class="empty-text">You don't have any miners yet.<br>Buy your first miner in the store!</div>
                    <a href="store.html" class="empty-btn">Go to Store</a>
                </div>`;
        } else {
            const ltcPerHourTotal = Math.round(totalPower * LTC_PER_GH * dailyRate * 1000) / 1000;
            const ltcPerDayTotal = Math.round(totalPower * LTC_PER_GH * dailyRate * 24 * 1000) / 1000;

            let html = `
                <div class="total-card">
                    <div>
                        <div class="total-label">Total Mining Power</div>
                        <div class="total-value">${totalPower.toFixed(1)} GH/S</div>
                        <div class="total-sub">+${ltcPerHourTotal} LTC/hr · +${ltcPerDayTotal} LTC/day</div>
                    </div>
                    <div style="text-align:right;">
                        <div class="total-label">Miners Active</div>
                        <div class="total-value" style="color:#22c55e;">${totalMiners}</div>
                    </div>
                </div>
                <div class="section-title">Your Equipment</div>`;

            rows.forEach(({ m, owned, power, ltcPerHour, ltcPerDay }) => {
                const cls = owned > 0 ? 'active' : 'empty';
                html += `
                <div class="miner-row ${cls}">
                    <div class="miner-svg">${m.svg}</div>
                    <div class="miner-info">
                        <div class="miner-name">${m.name}</div>
                        <div class="miner-desc">${m.desc}</div>
                        <div class="miner-badges">
                            <span class="badge purple">+${m.power} GH/S each</span>
                            <span class="badge green">+${ltcPerHour} LTC/hr</span>
                            <span class="badge yellow">+${ltcPerDay} LTC/day</span>
                        </div>
                    </div>
                    <div class="miner-count">
                        <div class="count-num">${owned}</div>
                        <div class="count-max">/ ${m.max}</div>
                    </div>
                </div>`;
            });

            area.innerHTML = html;
        }
    </script>
</body>
</html>
