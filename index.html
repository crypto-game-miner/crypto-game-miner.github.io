<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Miner</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #1a1613; -webkit-user-select: none; color: white; font-family: 'Courier New', Courier, monospace; }
        #main-content { display: flex; flex-direction: column; height: 100vh; height: 100dvh; text-align: center; }
        .header { padding: 15px 20px; font-weight: bold; color: #facc15; font-size: 18px; text-align: left; flex-shrink: 0; }
        .balance-container { background: rgba(0,0,0,0.4); margin: 5px 20px; padding: 12px; border-radius: 10px; border: 2px solid #3d2b1f; flex-shrink: 0; }
        .balance-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
        .balance-row:not(:last-child) { border-bottom: 1px solid #3d2b1f; margin-bottom: 6px; padding-bottom: 6px; }
        .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 220px; }
        .collect-btn { background: #facc15; color: #1a1613; border: none; padding: 14px 0; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 5px 0 #a16207; transition: transform 0.1s; width: 60%; }
        .collect-btn:disabled { background: #555; box-shadow: none; }
        .banner-area { position: fixed; bottom: 70px; left: 0; width: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; gap: 10px; padding: 8px 0; box-sizing: border-box; overflow: hidden; }
        .banner-scale { transform: scale(0.7); transform-origin: center center; display: block; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #333; z-index: 999; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: #8b949e; text-decoration: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; width: 25%; cursor: pointer; }
        .nav-item.active { color: #facc15; }
        .nav-icon { font-size: 24px; margin-bottom: 3px; }
        #ad-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
        body { text-transform: uppercase; }
        input { text-transform: none !important; }
    </style>
</head>
<body>
    <div id="main-content">
        <div id="ad-overlay">
            <div style="font-size: 40px;">💎</div>
            <h2 id="ad-status" style="color: #facc15;">VERIFYING...</h2>
            <div style="margin: 10px 0;">
                <iframe src="https://zerads.com/ad/ad.php?width=300&ref=11364" marginwidth="0" marginheight="0" width="300" height="250" scrolling="no" border="0" frameborder="0"></iframe>
            </div>
            <p>Wait <span id="ad-timer" style="font-size: 20px; color: #facc15;">10</span>s</p>
        </div>

        <div class="header">Faucet</div>
        <div class="balance-container">
            <div class="balance-row">
                <span style="color:#22c55e;">Game Coins</span>
                <span style="font-weight:bold; color:#22c55e;" id="game-coins">0</span>
            </div>
            <div class="balance-row">
                <span style="color:#facc15;">USDT Coins</span>
                <span style="font-weight:bold;" id="balance">0.0000</span>
            </div>
            <div class="balance-row">
                <span style="color:#a78bfa;">LTC Coins</span>
                <span style="font-weight:bold; color:#a78bfa;" id="ltc-balance">0.0000</span>
            </div>
        </div>

        <div class="game-area">
            <div style="font-size: 90px; margin-bottom: 10px; filter: drop-shadow(0 0 15px rgba(250,204,21,0.2));">⛏️</div>
            <button id="collect-btn" class="collect-btn" onclick="doClaim()" disabled>LOADING...</button>
            <p id="claims-left" style="color:#8b949e; font-size:12px; margin-top:10px;"></p>
            <p id="boost-info" style="font-size:11px; margin-top:4px; color:#a78bfa;"></p>
            <p id="login-hint" style="font-size:11px; margin-top:4px; color:#facc15;"></p>
        </div>

        <div class="banner-area">
            <div class="banner-scale">
                <iframe src="https://zerads.com/ad/ad.php?width=468&ref=11364" marginwidth="0" marginheight="0" width="468" height="60" scrolling="no" border="0" frameborder="0"></iframe>
            </div>
            <iframe src="//ads.coinserom.com/pub?adsunit=353639&size=320x50" style="width:320px;height:50px;border:0;padding:0;background-color:transparent;overflow:auto;"></iframe>
        </div>

        <div class="nav-bar">
            <a href="home.html" class="nav-item"><span class="nav-icon">🏠</span>Home</a>
            <div class="nav-item active"><span class="nav-icon">🚰</span>Faucet</div>
            <a href="tasks.html" class="nav-item"><span class="nav-icon">📋</span>Tasks</a>
            <a href="wallet.html" class="nav-item"><span class="nav-icon">👛</span>Wallet</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js';
        import { getFirestore, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBWMTTJo-iBtS7xxM3mjLWaTC0EOfl6MHw",
            authDomain: "crypto-miner-game-f45dc.firebaseapp.com",
            projectId: "crypto-miner-game-f45dc",
            storageBucket: "crypto-miner-game-f45dc.firebasestorage.app",
            messagingSenderId: "33690622473",
            appId: "1:33690622473:web:f80f6b836c15034e07f6d8"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        const API_BASE = '';
        const MAX_CLAIMS = 20;
        const POPUP_ON = [1, 10];

        let currentUser = null;
        let userData = {};
        let unsubscribe = null;

        // ─── Sign in anonymously if not already signed in ──────────────
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                localStorage.setItem('firebase_uid', user.uid);
                listenToUserData(user.uid);
            } else {
                try {
                    await signInAnonymously(auth);
                } catch (e) {
                    console.error('Anonymous sign-in failed:', e.message);
                    document.getElementById('collect-btn').innerText = 'CONNECTION ERROR';
                }
            }
        });

        function listenToUserData(uid) {
            if (unsubscribe) unsubscribe();
            unsubscribe = onSnapshot(doc(db, 'users', uid), (snap) => {
                userData = snap.exists() ? snap.data() : {};
                renderBalances();
                renderClaimsLeft();
                renderBoostInfo();
                renderLoginHint();
                document.getElementById('collect-btn').disabled = false;
                document.getElementById('collect-btn').innerText = 'CLAIM';
            }, (err) => {
                console.error('Snapshot error:', err.message);
            });

            // Sync offline mining earnings immediately, then every 60s
            syncMining(uid);
            setInterval(() => syncMining(uid), 60000);
        }

        async function syncMining(uid) {
            try {
                const miningCoin = localStorage.getItem('miningCoin') || 'ltc';
                await fetch(API_BASE + '/api/sync-mining', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uid, miningCoin }),
                });
                // Firestore onSnapshot will pick up the new balance automatically
            } catch (e) {
                console.error('Sync mining failed:', e.message);
            }
        }

        function renderBalances() {
            const coins    = userData.coins || 0;
            const gameCoins = userData.game_coins || 0;
            const ltc      = userData.ltc || 0;
            document.getElementById('balance').innerText = coins.toFixed(4);
            document.getElementById('game-coins').innerText = gameCoins;
            document.getElementById('ltc-balance').innerText = ltc.toFixed(4);
        }

        function renderClaimsLeft() {
            const today = new Date().toDateString();
            const claimsToday = userData.claimsDay === today ? (userData.claimsToday || 0) : 0;
            const el = document.getElementById('claims-left');
            el.innerText = claimsToday < MAX_CLAIMS
                ? `Claims Today: ${claimsToday}/${MAX_CLAIMS}`
                : "Daily Limit Reached! Come Back Tomorrow.";
        }

        function renderBoostInfo() {
            const now = Date.now();
            const boosts = (userData.claimBoosts || []).filter(b => {
                const t = b.time?.toMillis ? b.time.toMillis() : b.time;
                return now - t < 86400000;
            });
            const total = Math.round(boosts.reduce((s, b) => s + b.amount, 0) * 10) / 10;
            const el = document.getElementById('boost-info');
            el.innerText = total > 0 ? `⚡ Active Claim Boost: +${total.toFixed(1)} GH/s (24h each)` : '';
        }

        function renderLoginHint() {
            const hint = document.getElementById('login-hint');
            const isRealLogin = !!userData.email;
            hint.innerHTML = isRealLogin ? '' : '🔒 <a href="settings.html" style="color:#facc15;">Sign in</a> to get a higher claim reward!';
        }

        async function verifyAd() {
            try {
                await fetch('https://zerads.com/favicon.ico', { mode: 'no-cors', cache: 'no-store' });
                return true;
            } catch { return false; }
        }

        window.doClaim = async function() {
            if (!currentUser) return;

            const today = new Date().toDateString();
            const claimsToday = userData.claimsDay === today ? (userData.claimsToday || 0) : 0;
            if (claimsToday >= MAX_CLAIMS) return alert('Daily Limit Reached! Come Back Tomorrow.');

            const btn = document.getElementById('collect-btn');
            btn.disabled = true;

            const nextClaim = claimsToday + 1;
            if (POPUP_ON.includes(nextClaim)) {
                window.open('https://zerads.com/ad/pop.php?ref=11364', '_blank');
            }

            const overlay = document.getElementById('ad-overlay');
            const status  = document.getElementById('ad-status');
            overlay.style.display = 'flex';
            const ok = await verifyAd();
            status.innerText = ok ? "AD LOADED ✅" : "ADBLOCK DETECTED! ❌";
            status.style.color = ok ? "#00ff00" : "#ff4444";

            let timeLeft = 10;
            const timerAd = setInterval(async () => {
                timeLeft--;
                document.getElementById('ad-timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerAd);
                    overlay.style.display = 'none';

                    if (ok) {
                        try {
                            const resp = await fetch(API_BASE + '/api/claim', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ uid: currentUser.uid }),
                            });
                            const result = await resp.json();
                            if (!result.success) {
                                alert(result.error || 'Claim failed');
                            } else {
                                syncMining(currentUser.uid);
                            }
                            // onSnapshot will auto-update the UI with new balance
                        } catch (e) {
                            alert('Network error: ' + e.message);
                        }
                    }
                    btn.disabled = false;
                }
            }, 1000);
        };
    </script>
</body>
</html>
